<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Islamiyyah Register</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg: #0f172a; --card-bg: #1e293b; --primary: #3b82f6;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --text: #f8fafc; --text-dim: #94a3b8;
            --female: #ec4899; --male: #0ea5e9;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; margin: 0 auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #334155; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; }
        h3, h4 { margin: 0 0 15px 0; color: var(--primary); }
        
        #syncBadge { position: absolute; top: 15px; right: 20px; font-size: 0.65rem; padding: 4px 8px; border-radius: 20px; background: #334155; color: var(--text-dim); }
        .syncing { color: var(--warning) !important; }
        .synced { color: var(--success) !important; }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { font-size: 0.75rem; color: var(--text-dim); display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: var(--bg); color: white; font-size: 0.9rem; outline: none; }
        
        #dayStatus { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--warning); color: var(--warning); padding: 10px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }
        .marking-zone { text-align: center; padding: 10px 0; }
        .name-display { font-size: 2.2rem; font-weight: 800; margin: 20px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; color: #fff; text-align: center; }
        
        .absence-warning { background: #450a0a; border: 1px solid var(--danger); color: #fca5a5; padding: 15px; border-radius: 15px; margin-bottom: 20px; font-size: 0.85rem; text-align: left; border-left: 5px solid var(--danger); }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { border: none; padding: 18px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-absent { background: var(--danger); color: white; }
        .btn-present { background: var(--success); color: white; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn:active { transform: scale(0.95); }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tab-btn { background: var(--card-bg); color: var(--text-dim); border: 1px solid #334155; padding: 10px 15px; border-radius: 10px; cursor: pointer; white-space: nowrap; font-size: 0.8rem; flex: 1; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; color: var(--text-dim); padding: 10px; border-bottom: 2px solid #334155; }
        td { padding: 12px 10px; border-bottom: 1px solid #334155; }
        .hidden { display: none !important; }
        .text-danger { color: #f87171; }
        .text-success { color: #4ade80; }
        
        .list-header { background: #334155; padding: 8px 15px; border-radius: 8px; font-size: 0.75rem; margin-top: 15px; font-weight: bold; color: var(--text-dim); text-transform: uppercase; }
        .btn-edit { color: var(--warning); background: none; border: none; margin-right: 12px; font-weight: bold; cursor: pointer; }
        .edit-input { background: var(--bg); color: white; border: 1px solid var(--primary); padding: 5px 8px; border-radius: 8px; width: 60%; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div id="syncBadge">Connecting...</div>
        <h3>Class Register</h3>
        <div id="dayStatus" class="hidden"></div>
        <div class="input-row">
            <div><label>Date</label><input type="date" id="dateSelect" onchange="checkSchedule()"></div>
            <div><label>Session</label><select id="sessionSelect"></select></div>
        </div>
        <div class="marking-zone">
            <div id="absenceAlert" class="absence-warning hidden">
                <strong>⚠️ Consecutive Absences:</strong><br>
                <div id="absenceHistory" style="margin-top:5px; line-height: 1.4;"></div>
            </div>
            <div id="progressText" style="color: var(--text-dim); font-size: 0.8rem;">Ready</div>
            <div id="genderLabel" style="font-size: 0.7rem; font-weight: bold; margin-bottom: -15px;"></div>
            <div class="name-display" id="nameDisplay">---</div>
            <button id="startBtn" class="btn btn-primary" onclick="initMarking()">Start Session</button>
            <div id="markControls" class="btn-group hidden">
                <button class="btn btn-absent" onclick="processMark('Absent')">❌ Absent</button>
                <button class="btn btn-present" onclick="processMark('Present')">✅ Present</button>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('analytics')">Ranking</button>
        <button class="tab-btn" onclick="switchTab('logs')">Daily Logs</button>
        <button class="tab-btn" onclick="switchTab('students')">Students</button>
    </div>

    <div id="tab-analytics" class="card tab-pane">
        <h4>Performance Ranking</h4>
        <table><thead><tr><th>Student</th><th>P</th><th>A</th><th>Rate</th></tr></thead><tbody id="analyticsBody"></tbody></table>
    </div>

    <div id="tab-logs" class="card tab-pane hidden">
        <h4>Daily Logs</h4>
        <input type="date" id="logFilterDate" onchange="refreshLogs()" style="margin-bottom:15px;">
        <div id="logResults"><table><thead><tr><th>Session</th><th>Absents</th></tr></thead><tbody id="logsBody"></tbody></table></div>
    </div>

    <div id="tab-students" class="card tab-pane hidden">
        <h4>Manage Students</h4>
        <input type="text" id="studentInput" placeholder="Enter Name..." style="margin-bottom:10px;">
        <div class="input-row">
            <select id="genderSelectInput">
                <option value="females">Female</option>
                <option value="males">Male</option>
            </select>
            <button class="btn btn-present" onclick="addNewStudent()" style="padding:0;">Add Student</button>
        </div>
        <div id="studentList"></div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => console.log("SW Registered"));
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDv_d91DB9eYBkemhHCOgEb2FhvsYyH_dg",
      authDomain: "islamiyyah-register.firebaseapp.com",
      projectId: "islamiyyah-register",
      storageBucket: "islamiyyah-register.firebasestorage.app",
      messagingSenderId: "461560249743",
      appId: "1:461560249743:web:18484ea2d9efdfc192dffa"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let students = { females: [], males: [] };
    let combinedList = [];
    let attendanceHistory = [];
    let currentIdx = 0;
    let currentSessionData = [];

    async function syncData() {
        updateSyncStatus('Syncing...', 'syncing');
        try {
            const doc = await db.collection('settings').doc('students').get();
            if (doc.exists) {
                const data = doc.data();
                students.females = data.females || [];
                students.males = data.males || [];
            }
            const history = await db.collection('attendance').orderBy('timestamp', 'desc').limit(50).get();
            attendanceHistory = history.docs.map(d => d.data());
            refreshData();
            updateSyncStatus('Cloud Synced', 'synced');
        } catch (e) { console.error(e); updateSyncStatus('Offline', ''); }
    }

    function updateSyncStatus(text, className) {
        const badge = document.getElementById('syncBadge');
        badge.innerText = text; badge.className = className;
    }

    function checkSchedule() {
        const day = new Date(document.getElementById('dateSelect').value).getUTCDay();
        const select = document.getElementById('sessionSelect');
        const startBtn = document.getElementById('startBtn');
        const statusBox = document.getElementById('dayStatus');
        if (day === 4 || day === 5) {
            startBtn.disabled = true; statusBox.innerText = "Closed: Thursday/Friday";
            statusBox.classList.remove('hidden'); select.innerHTML = '<option>Closed</option>';
        } else {
            startBtn.disabled = false; statusBox.classList.add('hidden');
            select.innerHTML = (day === 6 || day === 0) ? '<option>Morning</option><option>Evening</option>' : '<option>Single Session</option>';
        }
    }

    function initMarking() {
        combinedList = [
            ...students.females.map(name => ({ name, gender: 'Female' })),
            ...students.males.map(name => ({ name, gender: 'Male' }))
        ];
        if (combinedList.length === 0) return alert("Add students first.");
        currentIdx = 0; currentSessionData = [];
        document.getElementById('startBtn').classList.add('hidden');
        document.getElementById('markControls').classList.remove('hidden');
        updateUI();
    }

    function updateUI() {
        const student = combinedList[currentIdx];
        const nameDisp = document.getElementById('nameDisplay');
        const genderLbl = document.getElementById('genderLabel');
        
        nameDisp.innerText = student.name;
        genderLbl.innerText = student.gender;
        genderLbl.style.color = student.gender === 'Female' ? 'var(--female)' : 'var(--male)';
        document.getElementById('progressText').innerText = `Marking ${currentIdx + 1}/${combinedList.length}`;
    }

    async function processMark(status) {
        currentSessionData.push({ name: combinedList[currentIdx].name, status: status });
        currentIdx++;
        if (currentIdx < combinedList.length) updateUI();
        else {
            updateSyncStatus('Saving...', 'syncing');
            await db.collection('attendance').add({
                date: document.getElementById('dateSelect').value,
                session: document.getElementById('sessionSelect').value,
                data: currentSessionData,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            location.reload();
        }
    }

    function refreshData() {
        // Ranking
        const aBody = document.getElementById('analyticsBody'); aBody.innerHTML = '';
        [...students.females, ...students.males].forEach(name => {
            let p = 0, a = 0;
            attendanceHistory.forEach(h => {
                const res = h.data.find(r => r.name === name);
                if (res) res.status === 'Present' ? p++ : a++;
            });
            const rate = (p+a) === 0 ? 0 : Math.round((p/(p+a))*100);
            aBody.innerHTML += `<tr><td>${name}</td><td class="text-success">${p}</td><td class="text-danger">${a}</td><td>${rate}%</td></tr>`;
        });

        // Student List
        const sDiv = document.getElementById('studentList'); sDiv.innerHTML = '';
        renderSection(sDiv, 'Females', students.females, 'females');
        renderSection(sDiv, 'Males', students.males, 'males');
    }

    function renderSection(parent, label, list, key) {
        parent.innerHTML += `<div class="list-header">${label} (${list.length})</div>`;
        list.forEach((name, i) => {
            parent.innerHTML += `
                <div id="row-${key}-${i}" style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #334155;">
                    <span id="name-${key}-${i}">${name}</span>
                    <div id="actions-${key}-${i}">
                        <button class="btn-edit" onclick="editStudent('${key}', ${i})">Edit</button>
                        <button onclick="removeStudent('${key}', ${i})" style="color:var(--danger); background:none; border:none; font-weight:bold;">Delete</button>
                    </div>
                </div>`;
        });
    }

    function editStudent(key, i) {
        const nameSpan = document.getElementById(`name-${key}-${i}`);
        const actionsDiv = document.getElementById(`actions-${key}-${i}`);
        const currentName = students[key][i];
        nameSpan.innerHTML = `<input type="text" id="input-${key}-${i}" class="edit-input" value="${currentName}">`;
        actionsDiv.innerHTML = `
            <button class="btn-edit" style="color:var(--success)" onclick="saveEdit('${key}', ${i})">Save</button>
            <button style="color:var(--text-dim); background:none; border:none;" onclick="refreshData()">Cancel</button>
        `;
    }

    async function saveEdit(key, i) {
        const newName = document.getElementById(`input-${key}-${i}`).value.trim();
        if (newName) {
            students[key][i] = newName;
            await db.collection('settings').doc('students').set(students);
            refreshData();
        }
    }

    async function addNewStudent() {
        const name = document.getElementById('studentInput').value.trim();
        const key = document.getElementById('genderSelectInput').value;
        if (name) {
            students[key].push(name);
            await db.collection('settings').doc('students').set(students);
            document.getElementById('studentInput').value = '';
            syncData();
        }
    }

    async function removeStudent(key, i) {
        if(confirm(`Delete student?`)) {
            students[key].splice(i, 1);
            await db.collection('settings').doc('students').set(students);
            syncData();
        }
    }

    function switchTab(t) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.remove('hidden');
        event.currentTarget.classList.add('active');
        if(t === 'logs') refreshLogs(); else refreshData();
    }

    function refreshLogs() {
        const date = document.getElementById('logFilterDate').value;
        const body = document.getElementById('logsBody'); body.innerHTML = '';
        attendanceHistory.filter(h => h.date === date).forEach(h => {
            const absents = h.data.filter(r => r.status === 'Absent').map(r => r.name).join(', ');
            body.innerHTML += `<tr><td>${h.session}</td><td class="text-danger">${absents || 'None'}</td></tr>`;
        });
    }

    document.getElementById('dateSelect').valueAsDate = new Date();
    document.getElementById('logFilterDate').valueAsDate = new Date();
    checkSchedule();
    syncData();
</script>
</body>
</html>
